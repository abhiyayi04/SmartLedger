{% extends 'base.html' %}
{% block title %}Delete Transaction — SmartLedger{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card border-0 shadow-sm mt-2">
      <div class="card-body p-4 text-center">
        <i class="bi bi-exclamation-triangle fs-1 text-danger"></i>
        <h4 class="mt-3 fw-bold">Delete Transaction?</h4>
        <p class="text-muted mt-2">
          <strong>{{ transaction.date }}</strong> — {{ transaction.description }}<br>
          <span class="{% if transaction.transaction_type == 'income' %}text-success{% else %}text-danger{% endif %}">
            ${{ transaction.amount }}
          </span>
        </p>
        <div class="d-flex gap-2 justify-content-center mt-4">
          <a href="{% url 'transaction_list' %}" class="btn btn-outline-secondary">Cancel</a>
          <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Delete</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
