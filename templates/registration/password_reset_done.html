{% extends 'base.html' %}

{% block title %}Check Your Email — SmartLedger{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border-0 mt-4">
      <div class="card-body p-4 text-center">
        <i class="bi bi-envelope-check fs-1 text-success"></i>
        <h4 class="mt-3 fw-bold">Check Your Terminal</h4>
        <p class="text-muted mt-2">
          A password reset link has been printed to the terminal (console email backend).
          Copy the link and open it in your browser.
        </p>
        <a href="{% url 'login' %}" class="btn btn-outline-dark mt-2">Back to Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
