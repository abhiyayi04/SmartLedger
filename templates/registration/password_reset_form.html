{% extends 'base.html' %}

{% block title %}Reset Password — SmartLedger{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border-0 mt-4">
      <div class="card-body p-4">
        <h4 class="card-title mb-1 fw-bold">Reset Password</h4>
        <p class="text-muted small mb-4">Enter your email address and we'll send you a reset link.</p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="{{ form.email.id_for_label }}" class="form-label">Email Address</label>
            <input type="email" name="email" id="{{ form.email.id_for_label }}"
                   class="form-control {% if form.email.errors %}is-invalid{% endif %}"
                   value="{{ form.email.value|default:'' }}" autofocus>
            {% for error in form.email.errors %}
              <div class="invalid-feedback">{{ error }}</div>
            {% endfor %}
          </div>
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-dark">Send Reset Link</button>
          </div>
        </form>
        <div class="text-center mt-3 small">
          <a href="{% url 'login' %}" class="text-decoration-none">Back to login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
