{% extends 'base.html' %}

{% block title %}Password Reset Complete — SmartLedger{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border-0 mt-4">
      <div class="card-body p-4 text-center">
        <i class="bi bi-check-circle fs-1 text-success"></i>
        <h4 class="mt-3 fw-bold">Password Reset!</h4>
        <p class="text-muted mt-2">Your password has been set. You can now log in with your new password.</p>
        <a href="{% url 'login' %}" class="btn btn-dark mt-2">Sign In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
