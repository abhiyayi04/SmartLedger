{% extends 'base.html' %}

{% block title %}{{ action }} Category — SmartLedger{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card border-0 shadow-sm mt-2">
      <div class="card-body p-4">
        <div class="d-flex align-items-center mb-4">
          <a href="{% url 'category_list' %}" class="btn btn-sm btn-outline-secondary me-3">
            <i class="bi bi-arrow-left"></i>
          </a>
          <h4 class="fw-bold mb-0">{{ action }} Category</h4>
        </div>
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label for="{{ form.name.id_for_label }}" class="form-label">Name</label>
            <input type="text" name="name" id="{{ form.name.id_for_label }}"
                   class="form-control {% if form.name.errors %}is-invalid{% endif %}"
                   value="{{ form.name.value|default:'' }}" autofocus>
            {% for error in form.name.errors %}
              <div class="invalid-feedback">{{ error }}</div>
            {% endfor %}
          </div>
          <div class="mb-3">
            <label for="{{ form.type.id_for_label }}" class="form-label">Type</label>
            <select name="type" id="{{ form.type.id_for_label }}"
                    class="form-select {% if form.type.errors %}is-invalid{% endif %}">
              <option value="">— Select type —</option>
              {% for value, label in form.type.field.choices %}
                <option value="{{ value }}" {% if form.type.value == value %}selected{% endif %}>
                  {{ label }}
                </option>
              {% endfor %}
            </select>
            {% for error in form.type.errors %}
              <div class="invalid-feedback">{{ error }}</div>
            {% endfor %}
          </div>
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-dark">
              {% if action == 'Add' %}Create Category{% else %}Save Changes{% endif %}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
